name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: frontend-demo:test
          load: true

      - name: Run container
        run: |
          docker run -d \
            --name frontend-demo \
            -p 8080:80 \
            frontend-demo:test

      - name: Check container
        run: docker ps

      - name: Test frontend
        run: curl --fail http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs frontend-demo

      - name: Stop container
        if: always()
        run: docker stop frontend-demo || true