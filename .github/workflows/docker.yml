name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "================================="
            echo "Installing required packages"
            echo "================================="

            # Install Docker and Git
            if ! command -v docker >/dev/null 2>&1; then
              sudo yum update -y
              sudo yum install -y docker
            fi

            if ! command -v git >/dev/null 2>&1; then
              sudo yum install -y git
            fi

            echo "Docker version:"
            sudo docker --version

            echo "Git version:"
            git --version


            echo "================================="
            echo "Starting Docker"
            echo "================================="

            sudo systemctl enable docker
            sudo systemctl start docker


            echo "================================="
            echo "Preparing application directory"
            echo "================================="

            rm -rf /home/ec2-user/frontend-project

            mkdir -p /home/ec2-user/frontend-project

            cd /home/ec2-user/frontend-project


            echo "================================="
            echo "Cloning repository"
            echo "================================="

            git clone https://github.com/Dheeraj2834/Docker-practice.git .


            echo "================================="
            echo "Repository contents"
            echo "================================="

            ls -la


            echo "================================="
            echo "Building Docker image"
            echo "================================="

            sudo docker build \
              -t frontend-app:latest \
              .


            echo "================================="
            echo "Stopping old container"
            echo "================================="

            sudo docker stop frontend-app || true

            sudo docker rm frontend-app || true


            echo "================================="
            echo "Starting new container"
            echo "================================="

            sudo docker run -d \
              --name frontend-app \
              --restart unless-stopped \
              -p 80:80 \
              frontend-app:latest


            echo "================================="
            echo "Container status"
            echo "================================="

            sudo docker ps


            echo "================================="
            echo "Container logs"
            echo "================================="

            sudo docker logs frontend-app


            echo "================================="
            echo "Deployment complete"
            echo "================================="

          EOF
